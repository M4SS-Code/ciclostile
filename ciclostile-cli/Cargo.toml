[package]
name = "ciclostile-cli"
version = "0.0.1"
description = "Fill .docx templates from the command line, with a JSON spec or flags"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["docx", "word", "template", "cli"]
categories = ["command-line-utilities", "text-processing", "template-engine"]

[[bin]]
name = "ciclostile"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ciclostile = { version = "0.0.1", path = ".." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# For the shared fixtures in ../tests/common, which build and read archives
# independently of ciclostile. zip's deflate-flate2 feature turns off
# flate2's default backend; this enables it again.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
